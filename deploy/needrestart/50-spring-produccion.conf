# springfieldDev: servicios de producción que needrestart NO reinicia solo.
#
# Tras cada unattended-upgrade, needrestart reinicia los servicios que usan una
# biblioteca actualizada. El 21-oct-2026 a las 06:25 reinició MySQL por
# libprotobuf (2 posiciones a la DLQ) y el 09-oct reinició RabbitMQ.
# Con esto quedan "deferred": siguen corriendo con la biblioteca vieja hasta
# reiniciarlos a mano en horario tranquilo. Para ver cuáles están pendientes:
#   sudo needrestart -r l
#
# Instalar: sudo install -m 644 -o root -g root 50-spring-produccion.conf /etc/needrestart/conf.d/

$nrconf{override_rc}{qr(^mysql\.service$)} = 0;
$nrconf{override_rc}{qr(^rabbitmq-server\.service$)} = 0;
$nrconf{override_rc}{qr(^nginx\.service$)} = 0;
# APIs Nest (nextAPI, crmAPI, shiftControlAPI, …) y mercadoPago
$nrconf{override_rc}{qr(API\.service$)} = 0;
$nrconf{override_rc}{qr(^mercadoPago\.service$)} = 0;
